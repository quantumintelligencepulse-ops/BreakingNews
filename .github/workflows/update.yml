name: Update TCG Homepage

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes
  workflow_dispatch:         # allows manual run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run TCG update engine
      run: |
        python build_cards_site.py

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "quantumintelligencepulse-ops"
        git config --global user.email "quantumintelligencepulse@gmail.com"
        git add index.html
        git commit -m "Auto-update TCG homepage" || echo "No changes to commit"
        git push
