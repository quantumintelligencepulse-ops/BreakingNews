name: Update TCG Homepage

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run TCG update engine
      run: |
        python build_cards_site.py

    - name: Commit and push changes
      uses: EndBug/add-and-commit@v9
      with:
        author_name: quantumintelligencepulse-ops
        author_email: quantumintelligencepulse@gmail.com
        message: "Auto-update TCG homepage"
        add: "index.html"
