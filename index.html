<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG News</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Georgia, serif;
            color: #111;
            line-height: 1.6;
        }

        header {
            padding: 30px 0;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            padding: 25px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .card:hover {
            opacity: 0.75;
        }

        .headline {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subheadline {
            font-size: 17px;
            color: #555;
            margin-bottom: 12px;
        }

        .meta {
            font-size: 14px;
            color: #999;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    TCG News
</header>

<div class="container">

    <!-- Example Article Card -->
    <div class="card">
        <div class="headline">Sample Headline for a TCG News Article</div>
        <div class="subheadline">A short description that feels like Medium and previews the story.</div>
        <div class="meta">Published today</div>
    </div>

    <div class="card">
        <div class="headline">Another Example Headline for Your Layout</div>
        <div class="subheadline">This is where your article summaries will go as you build the site.</div>
        <div class="meta">Published today</div>
    </div>

</div>

<footer>
    © 2026 TCG News
</footer>

</body>
</html>
